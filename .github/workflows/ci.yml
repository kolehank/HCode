# BYOK fork 常规 CI：push / PR 快速门禁（fork:guard + lint + typecheck）。
# 全量单测与三平台打包在 build.yml（手动 / v* tag 触发）。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 门禁（fork:guard / lint / typecheck）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        run: npm install -g pnpm@10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: fork:guard（出网/遥测门禁）
        run: pnpm fork:guard

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
